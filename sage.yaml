name: "sage-birdnet2"
namespace: "beckman"
version: "2.0.0"
description: "Versatile v2 cache-consumer BirdNET — re-architected as a pywaggle2 cache consumer that reads self-describing -v2- 15-second FLAC audio clips a producer wrote to the shared on-node /local-cache and runs BirdNET V2.4 acoustic classification frame-anchored (observation time = capture time). The cache dir is a single --input parameter, so the SAME plugin classifies any audio stream (e.g. /local-cache/camera-audio/mic, written by media-sampler3) with no code change, publishing per-species detections (env.detection.*). Audio metadata is read from a .flac.json sidecar the producer writes next to each clip."
authors: "Pete Beckman"
collaborators: "Sage Team"
funding: "NSF 2436842"
license: "BSD 3-clause"
keywords: "audio, birdnet, species, bioacoustics, consumer, acoustic classification, bird diversity, edge computing, cache consumer, pywaggle2, biodiversity"
homepage: "https://sagecontinuum.org"
source:
    architectures:
        - "linux/arm64"    # Thor target.
    url: "https://github.com/flint-pete/sage-birdnet2.git"
    branch: "master"
inputs:
    - id: "source"
      type: "string"
      description: "Acquisition mode: cache (consume media-sampler3 clips from the shared /local-cache; production), file (one local audio file; dev), or camera (ffmpeg/USB-mic capture; dev)."
    - id: "input"
      type: "string"
      description: "THE SWITCH. cache: per-stream dir <root>/<cache-name>/<source>, e.g. /local-cache/camera-audio/mic. file: path to an audio file."
    - id: "every"
      type: "string"
      description: "Wake cadence. 0 = single-shot (run once, exit). Accepts s/m/h."
    - id: "select-every"
      type: "string"
      description: "Sampling stride: one clip per this much CAPTURE-time. 0 = the newest unseen clip. Accepts s/m/h."
    - id: "max-frames"
      type: "int"
      description: "Cap clips classified per wake (0 = unlimited). Default 1."
    - id: "all-unseen"
      type: "boolean"
      description: "Backlog mode: classify every not-yet-seen clip (capped by max-frames)."
    - id: "max-runtime"
      type: "int"
      description: "Overall wall-clock bound in seconds (0 = forever)."
    - id: "consumer-id"
      type: "string"
      description: "Override the seen-store <consumer-id> segment (default <WAGGLE_JOB_NAME>-<WAGGLE_TASK_NAME>)."
    - id: "seen-store"
      type: "string"
      description: "Override the full seen-store path (default: under the cache's reserved .state area)."
    - id: "reprocess"
      type: "boolean"
      description: "Ignore the seen-store (classify regardless of memory); still records what it processes."
    - id: "camera"
      type: "string"
      description: "Dev (--source camera): ffmpeg audio source URL; omitted = node USB microphone."
    - id: "duration"
      type: "float"
      description: "Dev capture duration in seconds (default 15)."
    - id: "sample-rate"
      type: "int"
      description: "Dev capture sample rate in Hz (default 48000)."
    - id: "min-confidence"
      type: "float"
      description: "Minimum detection confidence 0.01-0.99 (default 0.6)."
    - id: "sensitivity"
      type: "float"
      description: "Detection sensitivity 0.5-1.5 (default 1.0)."
    - id: "overlap"
      type: "float"
      description: "Overlap in seconds between 3-second analysis windows (default 0.0)."
    - id: "top-k"
      type: "int"
      description: "Max predictions per 3-second chunk (default 5)."
    - id: "bandpass-fmin"
      type: "int"
      description: "Bandpass minimum frequency in Hz (default 0)."
    - id: "bandpass-fmax"
      type: "int"
      description: "Bandpass maximum frequency in Hz (default 8000 = Nyquist of the 16 kHz camera-mic stream)."
    - id: "batch-size"
      type: "int"
      description: "3-second chunks processed in parallel (default 1)."
    - id: "lat"
      type: "float"
      description: "Latitude for eBird range filtering; -1 = auto from node identity (WAGGLE_NODE_GPS_LAT), else no geo filter."
    - id: "lon"
      type: "float"
      description: "Longitude for eBird range filtering; -1 = auto from node identity, else no geo filter."
    - id: "week"
      type: "string"
      description: "Week of year 1-48 for seasonal filtering; auto = from today's date; -1 = year-round."
    - id: "sf-thresh"
      type: "float"
      description: "Species-filter threshold for the eBird geo model (default 0.03)."
    - id: "save-match"
      type: "string"
      description: "OR-list of Name:confidence rules matching the common OR scientific name (e.g. 'Northern Cardinal:0.5'), or '*:0.5'. Uploads the FLAC clip when any detection matches; omit to upload nothing."
resources:
    - type: "microphone"
metadata:
    ontology: env.detection.*
testing:
    mask_entrypoint: true
    command: ["python3", "-m", "pytest", "-q", "tests/"]
