name: "sage-birdnet2"
namespace: "beckman"
version: "2.0.0"
description: "Versatile v2 cache-consumer BirdNET — re-architected as a pywaggle2 cache consumer that reads self-describing -v2- 15-second FLAC audio clips a producer wrote to the shared on-node /local-cache and runs BirdNET V2.4 acoustic classification frame-anchored (observation time = capture time). The cache dir is a single --input parameter, so the SAME plugin classifies any audio stream (e.g. /local-cache/hummingcam/mic) with no code change, publishing per-species detections (env.detection.*). Audio metadata is read from a .flac.json sidecar the producer writes next to each clip."
authors: "Pete Beckman"
collaborators: "Sage Team"
funding: "NSF 2436842"
license: "BSD 3-clause"
keywords: "audio, birdnet, species, bioacoustics, consumer, acoustic classification, bird diversity, edge computing, cache consumer, pywaggle2, biodiversity"
homepage: "https://sagecontinuum.org"
source:
    architectures:
        - "linux/arm64"    # Thor target.
    url: "https://github.com/flint-pete/sage-birdnet2.git"
    branch: "master"
inputs:
    - id: "source"
      type: "string"
      description: "Acquisition mode: cache (consume producer clips from the shared cache — production) or audio-dir (local test folder)."
    - id: "input"
      type: "string"
      description: "THE SWITCH. cache dir <root>/<cache-name>/<camera> — point at an audio stream (e.g. /local-cache/hummingcam/mic) to classify its 15-second FLAC clips. Or a directory of test .flac/.wav files for audio-dir."
    - id: "every"
      type: "string"
      description: "Wake cadence. 0 = single-shot (run once, exit). Accepts s/m/h."
    - id: "select-every"
      type: "string"
      description: "Sampling stride: one clip per this much CAPTURE-time. 0 = the newest unseen clip. Accepts s/m/h."
    - id: "max-frames"
      type: "int"
      description: "Cap clips classified per wake (0 = unlimited)."
    - id: "all-unseen"
      type: "string"
      description: "Flag (no value). Backlog mode — classify every not-yet-seen clip (capped by max-frames). Include '--all-unseen' to enable."
    - id: "max-runtime"
      type: "int"
      description: "Overall wall-clock bound in seconds (0 = forever). Lets a scheduled job self-exit to free the CPU."
    - id: "consumer-id"
      type: "string"
      description: "Override the seen-store <consumer-id> segment (default: WAGGLE_JOB_NAME+WAGGLE_TASK_NAME). Give two instances the SAME id to cooperatively divide one cache."
    - id: "seen-store"
      type: "string"
      description: "Override the full seen-store path (default: auto, under the cache's reserved .state area)."
    - id: "reprocess"
      type: "string"
      description: "Flag (no value). Ignore the seen-store (classify regardless of memory); still records what it processes. Include '--reprocess' to enable."
    - id: "model"
      type: "string"
      description: "BirdNET model version to load (default: 2.4)."
    - id: "top-k"
      type: "int"
      description: "Number of top species predictions to report per clip (default: 5)."
    - id: "min-confidence"
      type: "float"
      description: "Below this a species prediction is discarded (default: 0.25)."
    - id: "geo-filter"
      type: "string"
      description: "Flag (no value). Restrict predictions to species plausible at the frame's lat/lon and week via BirdNET's eBird geo model. Falls back to no filter when the clip has no location. Include '--geo-filter' to enable."
    - id: "upload-audio"
      type: "string"
      description: "Y = allow matched audio-clip uploads, N = never. Governed by save-match when set."
    - id: "save-match"
      type: "string"
      description: "OR-list of Species:confidence rules — matches the SCIENTIFIC or COMMON name of any prediction (e.g. 'Archilochus colubris:0.5' or 'Ruby-throated Hummingbird:0.5'), or '*:0.5'. Uploads the clip when a prediction matches."
resources:
    - type: "microphone"
metadata:
    ontology: env.detection.*
testing:
    mask_entrypoint: true
    command: ["python3", "-m", "pytest", "-q", "tests/"]
